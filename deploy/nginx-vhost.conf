# Paste into the CloudPanel vhost for karaoke.<your-domain> (Vhost editor), inside the HTTPS `server { }` block,
# replacing the default `location /` block. PORT must match PORT in the app's .env.
#
# If the DNS record is proxied through Cloudflare (orange cloud), nginx must also learn the real visitor
# address, otherwise the app's rate limits would see every visitor as Cloudflare. Add, above the location block,
# one `set_real_ip_from <range>;` line for each range at https://www.cloudflare.com/ips/ and then:
#   real_ip_header CF-Connecting-IP;

location / {
  proxy_pass http://127.0.0.1:3000;
  proxy_http_version 1.1;

  # Socket.IO needs the WebSocket upgrade headers.
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection "upgrade";

  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  # Keep long-lived sockets open through quiet moments in a song.
  proxy_read_timeout 3600s;
  proxy_send_timeout 3600s;
}
